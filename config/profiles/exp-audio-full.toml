# EXPERIMENT ONLY -- NOT FOR CORPUS USE (PR-023 audio-grounding test, 2026-08-25).
# use_transcript=true + transcript_window=full VIOLATES Corpus Look-Ahead Freedom
# (docs/CONSTRAINTS.md). It exists to answer one question with the fidelity metric:
# does conditioning vision on the narration raise factual precision at all? If it
# does, the shippable version is per-frame CAUSAL speech, not this. Any timeline
# produced with this profile must be discarded, never merged into the corpus.
[vision]
fps = 2.0
use_transcript = true
transcript_window = "full"
[vision.adaptive]
enabled = true
scene_threshold = 0.08
max_gap_secs = 15.0
min_trigger_interval_secs = 2.0
max_frames_per_chunk = 45
[ollama]
temperature = 0.0
[whisper]
beam_size = 5
initial_prompt = ""
entropy_thold = 2.4
logprob_thold = -1.0
no_speech_thold = 0.6
temperature_inc = 0.2
repetition_report_thold = 2.4
repetition_window_secs = 30.0
[fidelity]
enabled = true
recall_reference = "kept"
