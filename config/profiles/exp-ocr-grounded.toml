# PR-024 A/B arm: market-research with OCR-grounded vision prompts.
# Identical to market-research in every other value, so the only difference from
# the ungrounded baseline (job 9dcbd12e on 2024_4_8) is the grounding.
#
# NOTE: with grounding on, the fidelity precision figure is CIRCULAR -- the prompt
# was fed the same OCR the score is computed against. Validation is by reading
# frames by hand (PR-024 verification criteria).
[vision]
fps = 2.0
use_transcript = false
transcript_window = "causal"
[vision.ocr_grounding]
enabled = true

[vision.adaptive]
enabled = true
scene_threshold = 0.08
max_gap_secs = 15.0
min_trigger_interval_secs = 2.0
max_frames_per_chunk = 45
[ollama]
temperature = 0.0
[whisper]
beam_size = 5
initial_prompt = ""
entropy_thold = 2.4
logprob_thold = -1.0
no_speech_thold = 0.6
temperature_inc = 0.2
repetition_report_thold = 2.4
repetition_window_secs = 30.0
[fidelity]
enabled = true
recall_reference = "kept"
