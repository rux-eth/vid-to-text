# PR-023 study arm: scene_threshold 0.08, max_gap_secs 15
# Generated from market-research.toml for the PR-023 study; every other value is identical.
[vision]
fps = 2.0
use_transcript = false
transcript_window = "causal"
[vision.adaptive]
enabled = true
scene_threshold = 0.08
max_gap_secs = 15.0
min_trigger_interval_secs = 2.0
max_frames_per_chunk = 45
[ollama]
temperature = 0.0
[whisper]
beam_size = 5
initial_prompt = ""
entropy_thold = 2.4
logprob_thold = -1.0
no_speech_thold = 0.6
temperature_inc = 0.2
repetition_report_thold = 2.4
repetition_window_secs = 30.0
[fidelity]
enabled = true
recall_reference = "kept"
