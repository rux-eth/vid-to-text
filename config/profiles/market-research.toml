# Market-research corpus capture profile.
#
# SOURCE OF TRUTH. This file is version-controlled; the copy under
# ~/.vid-to-text/config/profiles/ on the server is deployed FROM here
# (see config/deploy-profiles.sh). Do not edit the server copy directly.
#
# Every value below is research-backed. Sources and epistemic status:
#   prs/PR-020-market-research-capture-config.md  -> ## Research findings
# Operating point summary: docs/ARCHITECTURE.md -> ## Capture Configuration

[vision]
# Candidate rate. Adaptive sampling evaluates a frame every 0.5 s and keeps
# roughly one in twelve; 2 fps is also Qwen3-VL's native video fps. Measured on
# all 74 corpus videos (945 chunks): 88.9% of 2 fps candidates are visually
# unchanged from the previous candidate, and the trigger rate varies 6.7x between
# videos, so no fixed rate fits. (PR-022 design session, 2026-08-24)
fps = 2.0

# Visual descriptions as INDEPENDENT observation, not a restatement of audio.
# Conditioning vision on the transcript is the documented-harmful direction:
# language priors displace visual grounding (PR-020 Q3). The beneficial
# direction (vision grounding audio) is unimplemented -- see PR-021.
use_transcript = false

# Enforces the Corpus Look-Ahead Freedom constraint (docs/CONSTRAINTS.md).
# With `full`, a description covering t=0-7.5s is generated from speech through
# t=180s. Look-Ahead-Freedom is a formal pipeline property, and "textual sources
# that contain hindsight" is a named leakage vector (PR-020 Q4).
transcript_window = "causal"

[vision.adaptive]
# Hybrid selection: uniform floor + change-triggered frames + per-chunk cap.
# Mechanism proven (ffmpeg 4.4.2 behaviour, real PTS); whether it beats uniform
# at equal budget on static screen content is best-guess-given-constraints --
# the literature is split and no description-quality metric exists. Fixed mode
# is `enabled = false`. See docs/ARCHITECTURE.md, Frame Sampling.
enabled = true
# ffmpeg `select` scene score vs the previous candidate. Inspected on this
# corpus: 0.037 = crosshair redraw, 0.076 / 0.126 = chart pan or zoom steps,
# 0.448 = slide change. The signal sees change ONSETS; settled states are
# captured by the floor. No literature value exists.
scene_threshold = 0.08
# Floor: every persisted screen state is captured within 15 s (12 frames per
# 180 s chunk). Bounds the settled-state lag the onset-only signal leaves open.
max_gap_secs = 15.0
# Refractory: 17% of raw triggers at this threshold fall within 2 s of a kept
# frame (redraw bursts); de-clustering them costs no coverage.
min_trigger_interval_secs = 2.0
# Ceiling = the fps-0.25 arm's density (3 requests per chunk), bounding the
# corpus's worst case at ~26 h. Never binds on this corpus: 15.4 frames per
# chunk on average, p95 22, max 29. Measured on clip900 under this profile:
# 0.35x realtime, i.e. ~16 h for the 45.4 h corpus.
max_frames_per_chunk = 45

[ollama]
# Greedy decoding. Removes SAMPLING variance only.
# NOT bit-reproducible: non-determinism at temperature 0 comes from batch-size
# dependence of reduction kernels, and the fix (batch-invariant kernels, ~60%
# overhead) is not implemented by Ollama. No seed is set -- greedy decoding has
# no sampling step, so a seed would be inert. (PR-020 Q7, Group D)
temperature = 0.0

[whisper]
# Whisper paper Sec 4.5 prescribes beam-5 from temperature 0. Greedy is
# documented to fall into repetition loops on long-form audio; the previously
# shipped Greedy{best_of:1} was below upstream default. (PR-020 Q6)
beam_size = 5

# DO NOT SET. Upstream-documented failure mode: the prompt feature "will cause
# specific hallucinations and repetitions". Measured on this corpus: 90% of one
# segment repeated, real content deleted, while the jargon benefit it is meant
# to buy did not materialise. (PR-020 Q6, counter-case probe)
initial_prompt = ""

# whisper.cpp defaults, matching Whisper paper Sec 4.5. Verified 1:1 through
# whisper-rs to identically-named whisper_full_params fields (PR-020 Group D).
# These are RETRY TRIGGERS, NOT FILTERS -- the final temperature accepts
# unconditionally, and the paper's Table 7 shows zero WER gain from fallback.
entropy_thold = 2.4
logprob_thold = -1.0
no_speech_thold = 0.6
temperature_inc = 0.2

# Post-hoc repetition diagnostic. Flags; never edits. 2.4 matches OpenAI
# Whisper's own compression_ratio_threshold. Known false positives: counting,
# choruses, backchannel, litany all exceed it -- which is why it does not filter.
#
# Known false positives at any unit: counting, choruses, backchannel and litany
# all exceed 2.4 -- which is why this flags and never filters.
repetition_report_thold = 2.4

# Scored over 30 s windows of consecutive speech, the unit OpenAI calibrated 2.4
# on. Re-scoring this corpus by window recovered two genuine loops that
# per-segment scoring missed, one in this profile's own beam-5 transcript of
# 2024_2_12 ("So let's go to the 4th hour." x15: 0.85 per segment, 4.90 per
# window). Closes the calibration item PR-020 deferred. (PR-022)
repetition_window_secs = 30.0
